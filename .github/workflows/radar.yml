name: Mise à jour quotidienne du radar TV

on:
  # Tous les jours à 6h du matin heure de Bruxelles (4h UTC en été, 5h UTC en hiver)
  schedule:
    - cron: '0 5 * * *'
  # Permet aussi de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lancer le radar
        run: python3 radar.py

      - name: Diagnostic - lister les variantes TV5
        run: |
          python3 << 'EOF'
          import urllib.request, gzip
          from xml.etree import ElementTree as ET
          
          sources = {
              'FR1': 'https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz',
              'BE2': 'https://epgshare01.online/epgshare01/epg_ripper_BE2.xml.gz',
          }
          
          for name, url in sources.items():
              print(f'\n=== Source {name} ===')
              req = urllib.request.Request(url, headers={'User-Agent': 'RadarTerroir/1.0'})
              data = gzip.decompress(urllib.request.urlopen(req).read())
              root = ET.fromstring(data)
              
              tv5_ids = []
              for ch in root.findall('channel'):
                  ch_id = ch.get('id', '')
                  names = [dn.text or '' for dn in ch.findall('display-name')]
                  if 'TV5' in ch_id.upper() or any('TV5' in (n or '').upper() for n in names):
                      tv5_ids.append((ch_id, names))
              
              print(f'{len(tv5_ids)} chaines TV5 trouvees:')
              for ch_id, names in tv5_ids:
                  print(f'\n  ID XMLTV: {ch_id}')
                  print(f'  Noms affiches: {names}')
                  progs = [p for p in root.findall('programme') if p.get('channel') == ch_id]
                  progs.sort(key=lambda p: p.get('start', ''))
                  print(f'  {len(progs)} programmes au total')
                  print(f'  Echantillon des 5 premiers programmes:')
                  for p in progs[:5]:
                      title_el = p.find('title')
                      title = title_el.text if title_el is not None else '?'
                      start = p.get('start', '?')
                      print(f'    [{start}] {title}')
          EOF

      - name: Commit le radar.json si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if git diff --staged --quiet; then
            echo "Aucun changement dans radar.json"
          else
            git commit -m "🤖 Mise à jour automatique du radar"
            git pull --rebase origin main
            git push
          fi
