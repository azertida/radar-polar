name: Mise à jour quotidienne du radar TV

on:
  # Tous les jours à 6h du matin heure de Bruxelles (4h UTC en été, 5h UTC en hiver)
  schedule:
    - cron: '0 5 * * *'
  # Permet aussi de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lancer le radar
        run: python3 radar.py

      - name: Diagnostic - chercher des mots-clés dans le XML brut
        run: |
          python3 << 'EOF'
          import urllib.request, gzip, re
          sources = {
              'FR1': 'https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz',
              'BE2': 'https://epgshare01.online/epgshare01/epg_ripper_BE2.xml.gz',
          }
          keywords = ['Ventoux', 'Balagne', 'Finistère']
          for name, url in sources.items():
              print(f'\n=== Source {name} ===')
              data = gzip.decompress(urllib.request.urlopen(url).read()).decode('utf-8', errors='replace')
              for kw in keywords:
                  print(f'\n--- Recherche de "{kw}" ---')
                  # Extraire les <title> contenant le mot-clé
                  pattern = re.compile(r'<title[^>]*>([^<]*' + re.escape(kw) + r'[^<]*)</title>', re.IGNORECASE)
                  matches = pattern.findall(data)
                  if matches:
                      for m in set(matches):
                          print(f'  TROUVÉ : "{m}"')
                  else:
                      print(f'  rien trouvé')
          EOF

      - name: Commit le radar.json si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.json
          if git diff --staged --quiet; then
            echo "Aucun changement dans radar.json"
          else
            git commit -m "🤖 Mise à jour automatique du radar"
            git pull --rebase origin main
            git push
          fi
